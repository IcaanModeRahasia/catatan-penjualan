<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATATAN PESANAN - AI UMKM</title>
  
  <!-- CSS Tampilan Dapur & Mobile Responsive -->
  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --primary-brown: #8D5B4C;
      --primary-hover: #72473A;
      --secondary-brown: #D7CCC8;
      --text-dark: #3E2723;
      --text-muted: #8D6E63;
      --accent-cream: #F5F2EF;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-dark); padding: 15px; }
    
    .card { 
      background: var(--card-bg); 
      padding: 24px; 
      border-radius: 16px; 
      box-shadow: 0 6px 20px rgba(141, 91, 76, 0.08); 
      margin-bottom: 15px; 
      border: 1px solid rgba(215, 204, 200, 0.4);
    }

    h2, h3 { margin-bottom: 8px; color: var(--text-dark); text-align: center; }
    
    .app-subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-top: 10px; }
    input, select, textarea, button { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; border: 1px solid var(--secondary-brown); border-radius: 10px; font-size: 14px; background-color: var(--accent-cream); color: var(--text-dark); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary-brown); background-color: #fff; }

    button { background-color: var(--primary-brown); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: var(--primary-hover); }
    button.btn-secondary { background-color: #A1887F; }
    button.btn-secondary:hover { background-color: #8D6E63; }
    button.btn-danger { background-color: #D32F2F; }
    button.btn-reject { background-color: #D32F2F; width: 48%; }
    button.btn-accept { background-color: #388E3C; width: 48%; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 16px; box-shadow: 0 4px 12px rgba(141, 91, 76, 0.06); margin-bottom: 15px; border: 1px solid rgba(215, 204, 200, 0.4); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--secondary-brown); }
    
    .view-section { display: none; }
    .active-view { display: block; }
    
    .order-card { border-left: 6px solid #D7B19D; padding: 15px; background: var(--accent-cream); border-radius: 10px; margin-bottom: 12px; }
    .order-card.accepted { border-left-color: #388E3C; background: #E8F5E9; }
    .order-card.rejected { border-left-color: #D32F2F; background: #FFEBEE; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; color: white; background: #D7B19D; }
    .badge.accepted { background: #388E3C; }
    .badge.rejected { background: #D32F2F; }
    
    .btn-group { display: flex; justify-content: space-between; gap: 10px; }
    .mic-btn { background-color: #6D4C41; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .footer-contact { text-align: center; margin-top: 15px; }
    .footer-contact a { font-size: 11px; color: var(--text-muted); text-decoration: none; }
  </style>

  <!-- SDK Supabase Official CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- HALAMAN AUTH (LOGIN & REGISTER) -->
  <div id="auth-view" class="view-section active-view">
    <div class="card" style="max-width: 400px; margin: 40px auto;">
      <h2>CATATAN PESANAN</h2>
      <p class="app-subtitle">Layanan aplikasi untuk membantu bisnis anda menjadi lebih mudah dan ringan.</p>
      
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username">
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password">
      
      <button id="btn-login" type="button">Masuk (Login)</button>
      <button id="btn-register" type="button" class="btn-secondary">Daftar Akun Baru</button>

      <div class="footer-contact">
        <a href="https://wa.me/6283199265399" target="_blank">contact perancang apk</a>
      </div>
    </div>
  </div>

  <!-- CONTAINER DASHBOARD UTAMA -->
  <div id="app-view" class="view-section">
    <div class="header-bar">
      <div class="user-info">
        <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar" class="avatar">
        <div>
          <strong id="user-display-name" style="font-size: 14px;">Nama Pengguna</strong>
          <div style="font-size: 11px; color: var(--text-muted);" id="user-role-badge">Role: Kasir</div>
        </div>
      </div>
      <div>
        <button id="btn-to-profile" class="btn-secondary" style="width: auto; padding: 6px 10px; font-size: 12px; margin: 0;">Profil</button>
        <button id="btn-logout" class="btn-danger" style="width: auto; padding: 6px 10px; font-size: 12px; margin: 0;">Keluar</button>
      </div>
    </div>

    <!-- PROFIL VIEW -->
    <div id="profile-view" class="view-section">
      <div class="card">
        <h3>Pengaturan Profil Akun</h3>
        <label for="profile-name">Nama Lengkap / Panggilan</label>
        <input type="text" id="profile-name" placeholder="Contoh: Uda Roni">
        
        <label for="profile-role">Pilih Role / Peran Kerja</label>
        <select id="profile-role">
          <option value="kasir">Kasir (Input Pesanan Suara/Teks)</option>
          <option value="koki">Koki / Dapur (Terima/Tolak Pesanan)</option>
        </select>

        <label for="profile-avatar">URL Foto Profil (Opsional)</label>
        <input type="text" id="profile-avatar" placeholder="https://link-foto.com/avatar.jpg">

        <button id="btn-save-profile" type="button">Simpan Profil</button>
        <button id="btn-back-dashboard" type="button" class="btn-secondary">Kembali ke Dashboard</button>
      </div>
    </div>

    <!-- KASIR VIEW -->
    <div id="kasir-view" class="view-section">
      <div class="card">
        <h3>Input Pesanan Baru (Kasir)</h3>
        <button id="mic-btn" class="mic-btn" type="button">🎤 Merekam Suara Pesanan</button>
        <p id="mic-status" style="font-size: 12px; color: var(--primary-brown); margin-top: -6px; text-align: center;"></p>

        <label for="order-input">Teks Pesanan:</label>
        <textarea id="order-input" rows="4" placeholder="Contoh: Nasi rendang 1 kuah banjir, es teh 1..."></textarea>
        
        <button id="btn-send-order" type="button">Kirim Pesanan ke Koki 🚀</button>
      </div>

      <div class="card">
        <h3>Status Pesanan Dikirim</h3>
        <div id="kasir-order-list"></div>
      </div>
    </div>

    <!-- KOKI VIEW -->
    <div id="koki-view" class="view-section">
      <div class="card">
        <h3>Daftar Pesanan Masuk (Dapur)</h3>
        <div id="koki-order-list"></div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC DIRECT EMBED -->
  <script>
    const SUPABASE_URL = 'https://yefgcfewdmcrwgglausz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__FjySgCRaX-NHkIt5Az7kw_q4OaQYWa';

    let supabaseClient;
    let currentUser = null;
    let recognition = null;
    let isRecording = false;

    window.addEventListener('DOMContentLoaded', () => {
      // Init Supabase Client
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } else {
        alert('Gagal memuat library Supabase. Periksa koneksi internet!');
      }

      // Event Listeners Tombol
      document.getElementById('btn-register').addEventListener('click', handleRegister);
      document.getElementById('btn-login').addEventListener('click', handleLogin);
      document.getElementById('btn-logout').addEventListener('click', handleLogout);
      document.getElementById('btn-to-profile').addEventListener('click', () => switchView('profile-view'));
      document.getElementById('btn-save-profile').addEventListener('click', saveProfile);
      document.getElementById('btn-back-dashboard').addEventListener('click', backToMainDashboard);
      document.getElementById('btn-send-order').addEventListener('click', sendOrderToKoki);
      document.getElementById('mic-btn').addEventListener('click', toggleMic);

      // Cek login tersimpan
      const savedUser = localStorage.getItem('catatan_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        setupAppView();
      }
    });

    async function handleRegister() {
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      if (!usernameInput || !passwordInput) {
        alert('Mohon isi Username dan Password terlebih dahulu!');
        return;
      }

      const { data, error } = await supabaseClient
        .from('users')
        .insert([{ username: usernameInput, password: passwordInput, name: usernameInput, role: 'kasir' }]);

      if (error) {
        alert('Gagal daftar: ' + error.message);
      } else {
        alert('Akun berhasil dibuat! Silakan klik Masuk (Login).');
      }
    }

    async function handleLogin() {
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      if (!usernameInput || !passwordInput) {
        alert('Mohon isi Username dan Password!');
        return;
      }

      const { data: user, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('username', usernameInput)
        .eq('password', passwordInput)
        .single();

      if (error || !user) {
        alert('Username atau Password salah/belum terdaftar!');
        return;
      }

      currentUser = user;
      localStorage.setItem('catatan_user', JSON.stringify(currentUser));
      setupAppView();
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('catatan_user');
      document.getElementById('auth-view').classList.add('active-view');
      document.getElementById('app-view').classList.remove('active-view');
    }

    function switchView(viewId) {
      const views = ['profile-view', 'kasir-view', 'koki-view'];
      views.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = (id === viewId) ? 'block' : 'none';
      });
    }

    function backToMainDashboard() {
      if (currentUser?.role === 'koki') { switchView('koki-view'); } 
      else { switchView('kasir-view'); }
    }

    function setupAppView() {
      document.getElementById('auth-view').classList.remove('active-view');
      document.getElementById('app-view').classList.add('active-view');

      document.getElementById('user-display-name').innerText = currentUser.name || currentUser.username;
      document.getElementById('user-role-badge').innerText = 'Role: ' + (currentUser.role ? currentUser.role.toUpperCase() : 'KASIR');
      if (currentUser.avatar) document.getElementById('user-avatar').src = currentUser.avatar;

      if (currentUser.role === 'koki') {
        switchView('koki-view');
        loadOrdersForKoki();
      } else {
        switchView('kasir-view');
        loadOrdersForKasir();
      }
      listenRealtimeOrders();
    }

    async function saveProfile() {
      const name = document.getElementById('profile-name').value.trim();
      const role = document.getElementById('profile-role').value;
      const avatar = document.getElementById('profile-avatar').value.trim();

      const { error } = await supabaseClient.from('users').update({ name, role, avatar }).eq('id', currentUser.id);

      if (error) {
        alert('Gagal update profil: ' + error.message);
      } else {
        currentUser.name = name; currentUser.role = role; currentUser.avatar = avatar;
        localStorage.setItem('catatan_user', JSON.stringify(currentUser));
        alert('Profil diperbarui!');
        setupAppView();
      }
    }

    function toggleMic() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Browser HP tidak mendukung fitur rekaman suara.');
        return;
      }
      if (isRecording) { recognition.stop(); return; }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'id-ID';

      recognition.onstart = () => { isRecording = true; document.getElementById('mic-status').innerText = 'Merekam... Bicara sekarang'; };
      recognition.onresult = (e) => { document.getElementById('order-input').value = e.results[0][0].transcript; };
      recognition.onend = () => { isRecording = false; document.getElementById('mic-status').innerText = ''; };
      recognition.start();
    }

    async function sendOrderToKoki() {
      const orderDetails = document.getElementById('order-input').value.trim();
      if (!orderDetails) { alert('Isi teks pesanan!'); return; }

      const { error } = await supabaseClient.from('orders').insert([{ kasir_name: currentUser.name || currentUser.username, details: orderDetails, status: 'pending' }]);

      if (error) { alert('Gagal kirim: ' + error.message); } 
      else {
        document.getElementById('order-input').value = '';
        alert('Pesanan terkirim ke Koki!');
        loadOrdersForKasir();
      }
    }

    async function loadOrdersForKasir() {
      const { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('kasir-order-list');
      if (!container) return;
      container.innerHTML = '';
      (orders || []).forEach(item => {
        const div = document.createElement('div');
        div.className = `order-card ${item.status}`;
        div.innerHTML = `<p><strong>Pesanan:</strong> ${item.details}</p><span class="badge ${item.status}">${item.status.toUpperCase()}</span>`;
        container.appendChild(div);
      });
    }

    async function loadOrdersForKoki() {
      const { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('koki-order-list');
      if (!container) return;
      container.innerHTML = '';
      (orders || []).forEach(item => {
        const div = document.createElement('div');
        div.className = `order-card ${item.status}`;
        div.innerHTML = `
          <p><strong>Dari:</strong> ${item.kasir_name}</p>
          <p><strong>Pesanan:</strong> ${item.details}</p>
          <p><strong>Status:</strong> <span class="badge ${item.status}">${item.status.toUpperCase()}</span></p>
          ${item.status === 'pending' ? `
            <div class="btn-group" style="margin-top: 10px;">
              <button class="btn-accept" onclick="updateOrderStatus('${item.id}', 'accepted')">Terima 👍</button>
              <button class="btn-reject" onclick="updateOrderStatus('${item.id}', 'rejected')">Tolak 👎</button>
            </div>
          ` : ''}
        `;
        container.appendChild(div);
      });
    }

    async function updateOrderStatus(id, status) {
      await supabaseClient.from('orders').update({ status }).eq('id', id);
      loadOrdersForKoki();
    }

    function listenRealtimeOrders() {
      supabaseClient.channel('orders-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
          if (currentUser?.role === 'koki') loadOrdersForKoki();
          else loadOrdersForKasir();
        }).subscribe();
    }
  </script>
</body>
</html>
