<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATATAN PESANAN - AI UMKM</title>
  
  <!-- CSS Tema Putih & Corak Cokelat Dapur -->
  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --primary-brown: #8D5B4C;      /* Cokelat hangat ala kayu/dapur */
      --primary-hover: #72473A;
      --secondary-brown: #D7CCC8;    /* Cokelat muda / krem */
      --text-dark: #3E2723;          /* Cokelat tua untuk teks utama */
      --text-muted: #8D6E63;         /* Cokelat keabuan untuk teks sekunder */
      --accent-cream: #F5F2EF;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-dark); padding: 15px; }
    
    .card { 
      background: var(--card-bg); 
      padding: 24px; 
      border-radius: 16px; 
      box-shadow: 0 6px 20px rgba(141, 91, 76, 0.08); 
      margin-bottom: 15px; 
      border: 1px solid rgba(215, 204, 200, 0.4);
    }

    h2, h3 { margin-bottom: 8px; color: var(--text-dark); text-align: center; }
    
    .app-subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-top: 10px; }
    input, select, textarea, button { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; border: 1px solid var(--secondary-brown); border-radius: 10px; font-size: 14px; background-color: var(--accent-cream); color: var(--text-dark); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary-brown); background-color: #fff; }

    button { background-color: var(--primary-brown); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: var(--primary-hover); }
    button.btn-secondary { background-color: #A1887F; }
    button.btn-secondary:hover { background-color: #8D6E63; }
    button.btn-danger { background-color: #D32F2F; }
    button.btn-reject { background-color: #D32F2F; width: 48%; }
    button.btn-accept { background-color: #388E3C; width: 48%; }
    
    /* Navigation Bar / Profil Header */
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 16px; box-shadow: 0 4px 12px rgba(141, 91, 76, 0.06); margin-bottom: 15px; border: 1px solid rgba(215, 204, 200, 0.4); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--secondary-brown); }
    
    /* Tab / View Management */
    .view-section { display: none; }
    .active-view { display: block; }
    
    /* Struk / Card Pesanan */
    .order-card { border-left: 6px solid #D7B19D; padding: 15px; background: var(--accent-cream); border-radius: 10px; margin-bottom: 12px; }
    .order-card.accepted { border-left-color: #388E3C; background: #E8F5E9; }
    .order-card.rejected { border-left-color: #D32F2F; background: #FFEBEE; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; color: white; background: #D7B19D; }
    .badge.accepted { background: #388E3C; }
    .badge.rejected { background: #D32F2F; }
    
    .btn-group { display: flex; justify-content: space-between; gap: 10px; }
    .mic-btn { background-color: #6D4C41; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    /* Footer Contact Kecil di Bawah */
    .footer-contact {
      text-align: center;
      margin-top: 15px;
    }
    .footer-contact a {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-contact a:hover {
      color: var(--primary-brown);
      text-decoration: underline;
    }
  </style>

  <!-- SDK Supabase CDN yang Benar -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. HALAMAN LOGIN / REGISTER -->
  <!-- ========================================== -->
  <div id="auth-view" class="view-section active-view">
    <div class="card" style="max-width: 400px; margin: 40px auto;">
      <h2>CATATAN PESANAN</h2>
      <p class="app-subtitle">Layanan aplikasi untuk membantu bisnis anda menjadi lebih mudah dan ringan.</p>
      
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username">
      
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password">
      
      <button onclick="handleLogin()">Masuk (Login)</button>
      <button onclick="handleRegister()" class="btn-secondary">Daftar Akun Baru</button>

      <!-- Link Contact Perancang APK -->
      <div class="footer-contact">
        <a href="https://wa.me/6283199265399" target="_blank">contact perancang apk</a>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- APP CONTAINER (DASHBOARD UTAMA) -->
  <!-- ========================================== -->
  <div id="app-view" class="view-section">
    
    <!-- HEADER PROFIL DI ATAS -->
    <div class="header-bar">
      <div class="user-info">
        <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar" class="avatar">
        <div>
          <strong id="user-display-name" style="font-size: 14px;">Nama Pengguna</strong>
          <div style="font-size: 11px; color: var(--text-muted);" id="user-role-badge">Role: Kasir</div>
        </div>
      </div>
      <div>
        <button onclick="switchView('profile-view')" class="btn-secondary" style="width: auto; padding: 6px 10px; font-size: 12px; margin: 0;">Profil</button>
        <button onclick="handleLogout()" class="btn-danger" style="width: auto; padding: 6px 10px; font-size: 12px; margin: 0;">Keluar</button>
      </div>
    </div>

    <!-- 2. HALAMAN EDIT PROFIL -->
    <div id="profile-view" class="view-section">
      <div class="card">
        <h3>Pengaturan Profil Akun</h3>
        <label for="profile-name">Nama Lengkap / Panggilan</label>
        <input type="text" id="profile-name" placeholder="Contoh: Uda Roni">
        
        <label for="profile-role">Pilih Role / Peran Kerja</label>
        <select id="profile-role">
          <option value="kasir">Kasir (Input Pesanan Suara/Teks)</option>
          <option value="koki">Koki / Dapur (Terima/Tolak Pesanan)</option>
        </select>

        <label for="profile-avatar">URL Foto Profil (Opsional)</label>
        <input type="text" id="profile-avatar" placeholder="https://link-foto.com/avatar.jpg">

        <button onclick="saveProfile()">Simpan Profil</button>
        <button onclick="backToMainDashboard()" class="btn-secondary">Kembali ke Dashboard</button>
      </div>
    </div>

    <!-- 3. HALAMAN KASIR -->
    <div id="kasir-view" class="view-section">
      <div class="card">
        <h3>Input Pesanan Baru (Kasir)</h3>
        
        <button id="mic-btn" onclick="toggleMic()" class="mic-btn">
          🎤 Merekam Suara Pesanan
        </button>
        <p id="mic-status" style="font-size: 12px; color: var(--primary-brown); margin-top: -6px; text-align: center;"></p>

        <label for="order-input">Teks Pesanan:</label>
        <textarea id="order-input" rows="4" placeholder="Contoh: Nasi rendang 1 kuah banjir, es teh 1..."></textarea>
        
        <button onclick="sendOrderToKoki()">Kirim Pesanan ke Koki 🚀</button>
      </div>

      <div class="card">
        <h3>Status Pesanan Dikirim</h3>
        <div id="kasir-order-list"></div>
      </div>
    </div>

    <!-- 4. HALAMAN KOKI -->
    <div id="koki-view" class="view-section">
      <div class="card">
        <h3>Daftar Pesanan Masuk (Dapur)</h3>
        <div id="koki-order-list"></div>
      </div>
    </div>

  </div>

  <!-- File Logika JavaScript -->
  <script src="script.js"></script>
</body>
</html>
